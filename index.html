<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewLife Flight Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🛫 NewLife Flight Booking</h1>
        <p>Your journey to a new life starts here</p>
    </header>

    <main>
        <!-- Flight Search Section -->
        <section id="search-section" class="section">
            <h2>Find Your Flight</h2>
            <form id="flight-search-form">
                <div class="search-grid">
                    <div class="input-group">
                        <label for="from">From</label>
                        <select id="from" required>
                            <option value="">Select departure city</option>
                            <option value="NYC">New York (NYC)</option>
                            <option value="LAX">Los Angeles (LAX)</option>
                            <option value="CHI">Chicago (CHI)</option>
                            <option value="MIA">Miami (MIA)</option>
                            <option value="SFO">San Francisco (SFO)</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="to">To</label>
                        <select id="to" required>
                            <option value="">Select destination city</option>
                            <option value="NYC">New York (NYC)</option>
                            <option value="LAX">Los Angeles (LAX)</option>
                            <option value="CHI">Chicago (CHI)</option>
                            <option value="MIA">Miami (MIA)</option>
                            <option value="SFO">San Francisco (SFO)</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label for="departure-date">Departure Date</label>
                        <input type="date" id="departure-date" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="passengers">Passengers</label>
                        <select id="passengers">
                            <option value="1">1 Passenger</option>
                            <option value="2">2 Passengers</option>
                            <option value="3">3 Passengers</option>
                            <option value="4">4 Passengers</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="search-btn">Search Flights</button>
            </form>
        </section>

        <!-- Flight Results Section -->
        <section id="results-section" class="section hidden">
            <h2>Available Flights</h2>
            <div id="flight-results"></div>
        </section>

        <!-- Booking Form Section -->
        <section id="booking-section" class="section hidden">
            <h2>Passenger Information</h2>
            <form id="booking-form">
                <div id="passenger-forms"></div>
                
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" required>
                    </div>
                </div>
                
                <button type="submit" class="book-btn">Complete Booking</button>
            </form>
        </section>

        <!-- Confirmation Section -->
        <section id="confirmation-section" class="section hidden">
            <h2>✅ Booking Confirmed!</h2>
            <div id="booking-details"></div>
            <button onclick="startNew()" class="new-search-btn">Book Another Flight</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 NewLife Flight Booking. Your adventure awaits!</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
